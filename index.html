<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="フォレストMGタイマー">
<title>フォレストMG タイマー＆成績表連動</title>
<style>
  body {
    margin: 0; background: #0f172a; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    text-align: center; padding: 20px; box-sizing: border-box;
  }
  .box {
    background: #1e293b; border: 1px solid #334155; border-radius: 16px;
    padding: 28px 24px; max-width: 440px; width: 100%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .spinner {
    width: 42px; height: 42px; border: 4px solid #334155; border-top-color: #38bdf8;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; margin: 0 0 8px; color: #fff; }
  p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; line-height: 1.5; }
  .btn {
    display: inline-block; background: #0284c7; color: #fff; text-decoration: none;
    padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; margin-top: 8px;
  }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="sp"></div>
  <h1>⏱️ フォレストMG タイマーへ接続中...</h1>
  <p id="msg">最新のMGタイマー画面を開いています（このURLは第94回以降もずっと固定で使えます）</p>
  <div id="fallback" style="display:none">
    <a id="directBtn" class="btn" href="#">タイマー画面を開く</a>
  </div>
</div>
<script>
(function(){
  var redirected = false;
  var qs = location.search || "?v=11";
  function go(url) {
    if (redirected || !url) return;
    redirected = true;
    var base = url.split("?")[0].replace(/\/+$/, "");
    var target = base + "/" + (qs.indexOf("?") === 0 ? qs : "?v=11");
    var btn = document.getElementById("directBtn");
    if (btn) btn.href = target;
    location.replace(target);
  }

  // 1. Googleスプレッドシート(自分のこと MG!G4)からリアルタイム取得（待ち時間0秒・キャッシュなし）
  window.google = {
    visualization: {
      Query: {
        setResponse: function(res) {
          try {
            var rows = res.table.rows;
            if (rows && rows.length > 0) {
              var c = rows[0].c;
              for (var i = c.length - 1; i >= 0; i--) {
                if (c[i] && c[i].v && String(c[i].v).indexOf("https://") === 0) {
                  go(String(c[i].v).trim());
                  return;
                }
              }
            }
          } catch(e) {}
        }
      }
    }
  };
  var s = document.createElement("script");
  s.src = "https://docs.google.com/spreadsheets/d/1-W4fuicyCAptbB-DbeezaJDWDHCMrVNEv-YNAI0I0Fg/gviz/tq?tqx=out:json&sheet=MG&range=A4:G4&_=" + Date.now();
  document.head.appendChild(s);

  // 2. バックアップとして同リポジトリの tunnel.json も並列取得
  fetch("./tunnel.json?_=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      setTimeout(function(){
        if (!redirected && d && d.tunnel_url) go(d.tunnel_url);
      }, 600);
    })
    .catch(function(){});

  setTimeout(function(){
    if (!redirected) {
      document.getElementById("fallback").style.display = "block";
      document.getElementById("msg").textContent = "下のボタンをタップして開いてください。";
    }
  }, 3500);
})();
</script>
</body>
</html>
